<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="preload"
      href="/assets/fonts/montserrat-c4f4a8cd.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- LCP image of the landing page; fetch it in parallel with the JS instead of after it -->
    <link rel="preload" href="/media/portfolio/pp/0.webp" as="image" fetchpriority="high" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yehonatan Simian</title>
    <meta
      name="description"
      content="A personal website showcasing all my shenanigans and terrible dad jokes."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yonisimian.com/" />
    <meta property="og:title" content="Yehonatan Simian" />
    <meta
      property="og:description"
      content="A personal website showcasing all my shenanigans and terrible dad jokes."
    />
    <meta property="og:image" content="https://yonisimian.com/media/portfolio/pp/0.webp" />
  </head>
  <body>
    <!-- Lets Netlify detect the JS-rendered contact form at deploy time -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input
        type="hidden"
        name="subject"
        value="New message from yonisimian.com"
        data-remove-prefix
      />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
