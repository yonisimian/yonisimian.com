[build.environment]
  # bypass npm auto install
  NPM_FLAGS = "--version"
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

[build]
  publish = "dist"
  command = "pnpm run build"
  # Skip deploys when only the resume source changed; CI then commits the rendered PDF
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)resume'"

# Netlify Image CDN support
[[redirects]]
  from = "/cdnimg/*"
  to   = "/.netlify/images?url=/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
